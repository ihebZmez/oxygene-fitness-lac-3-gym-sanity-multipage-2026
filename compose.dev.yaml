services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: "0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    mem_limit: 512m
    cpus: "1.00"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  node_modules:
